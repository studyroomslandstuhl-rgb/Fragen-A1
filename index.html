<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A1 Fragen Trainer Pro</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  color: #333;
  min-height: 100vh;
  padding: 10px;
}

header {
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  color: white;
  padding: 25px;
  text-align: center;
  box-shadow: 0 4px 15px rgba(0,0,0,0.2);
  margin-bottom: 20px;
  border-radius: 15px;
}

header h1 { font-size: 2.5em; margin-bottom: 5px; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); }
header p { font-size: 1.1em; opacity: 0.95; }

main {
  max-width: 1200px;
  margin: 0 auto;
}

.card {
  background: white;
  border-radius: 15px;
  padding: 25px;
  margin: 15px 0;
  box-shadow: 0 8px 25px rgba(0,0,0,0.1);
  transition: all 0.3s ease;
}

.card:hover { box-shadow: 0 12px 35px rgba(0,0,0,0.15); }

.card h2 {
  color: #667eea;
  margin-bottom: 15px;
  font-size: 1.8em;
  border-bottom: 3px solid #764ba2;
  padding-bottom: 10px;
}

button {
  border: none;
  border-radius: 10px;
  padding: 12px 20px;
  margin: 8px;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  color: white;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.3s ease;
  box-shadow: 0 4px 10px rgba(0,0,0,0.2);
}

button:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 15px rgba(0,0,0,0.3);
}

button:active { transform: translateY(0); }

button:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

button.secondary {
  background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
}

button.success {
  background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
}

button.danger {
  background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
}

button.gamebtn {
  font-size: 18px;
  min-height: 100px;
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  min-width: 140px;
}

button.locked {
  background: #999;
  cursor: not-allowed;
  opacity: 0.6;
}

input, textarea, select {
  width: 100%;
  padding: 12px;
  margin: 10px 0;
  border-radius: 10px;
  border: 2px solid #ddd;
  font-size: 16px;
  transition: all 0.3s ease;
}

input:focus, textarea:focus, select:focus {
  outline: none;
  border-color: #667eea;
  box-shadow: 0 0 10px rgba(102, 126, 234, 0.3);
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 12px;
}

.big {
  font-size: 28px;
  font-weight: bold;
  color: #667eea;
  margin: 15px 0;
}

.small {
  font-size: 14px;
  color: #777;
}

.option {
  display: block;
  width: 100%;
  background: #f0f4ff;
  color: #333;
  text-align: left;
  padding: 15px;
  margin: 8px 0;
  border: 2px solid #ddd;
  border-radius: 10px;
  cursor: pointer;
  transition: all 0.3s ease;
  font-size: 16px;
}

.option:hover {
  background: #e3e8ff;
  border-color: #667eea;
  transform: translateX(5px);
}

.option.selected {
  background: #667eea;
  color: white;
  border-color: #667eea;
}

.word {
  background: #fff3cd;
  color: #333;
  padding: 10px 15px;
  margin: 5px;
  border-radius: 8px;
  display: inline-block;
  cursor: pointer;
  border: 2px solid #ffc107;
  transition: all 0.2s ease;
}

.word:hover { transform: scale(1.05); }

.word:disabled {
  opacity: 0.6;
}

.hidden { display: none !important; }

.ok {
  color: #2ecc71;
  font-weight: bold;
  background: #d5f4e6;
  padding: 15px;
  border-radius: 10px;
  margin: 10px 0;
  border-left: 4px solid #2ecc71;
}

.no {
  color: #e74c3c;
  font-weight: bold;
  background: #fadbd8;
  padding: 15px;
  border-radius: 10px;
  margin: 10px 0;
  border-left: 4px solid #e74c3c;
}

.memory {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
  gap: 12px;
}

.memcard {
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  color: white;
  min-height: 110px;
  border-radius: 12px;
  padding: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  cursor: pointer;
  font-size: 18px;
  font-weight: bold;
  transition: all 0.3s ease;
  box-shadow: 0 4px 10px rgba(0,0,0,0.2);
}

.memcard:hover:not(.done) {
  transform: scale(1.05);
}

.memcard.open {
  background: white;
  color: #333;
  border: 3px solid #667eea;
}

.memcard.done {
  background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
  cursor: default;
}

table {
  width: 100%;
  border-collapse: collapse;
  background: white;
  margin-top: 15px;
}

td, th {
  border: 1px solid #ddd;
  padding: 12px;
  text-align: left;
}

th {
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  color: white;
  font-weight: 600;
}

tr:nth-child(even) {
  background: #f9f9f9;
}

tr:hover {
  background: #f0f4ff;
}

.stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 12px;
  margin: 15px 0;
}

.stat-box {
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  color: white;
  padding: 20px;
  border-radius: 12px;
  text-align: center;
  box-shadow: 0 4px 10px rgba(0,0,0,0.2);
}

.stat-box .number {
  font-size: 2.5em;
  font-weight: bold;
  margin: 10px 0;
}

.stat-box .label {
  font-size: 0.9em;
  opacity: 0.9;
}

.progress-bar {
  width: 100%;
  height: 20px;
  background: #e0e0e0;
  border-radius: 10px;
  overflow: hidden;
  margin: 10px 0;
}

.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, #4facfe 0%, #00f2fe 100%);
  transition: width 0.3s ease;
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  font-size: 12px;
  font-weight: bold;
}

.feedback {
  margin: 15px 0;
  padding: 15px;
  border-radius: 10px;
  font-size: 16px;
}

.tabs {
  display: flex;
  gap: 10px;
  margin: 15px 0;
  border-bottom: 2px solid #ddd;
}

.tab-btn {
  padding: 10px 20px;
  background: none;
  border: none;
  border-bottom: 3px solid transparent;
  color: #667eea;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.3s ease;
  margin: 0;
}

.tab-btn.active {
  border-bottom-color: #667eea;
  color: #667eea;
}

.tab-content {
  display: none;
}

.tab-content.active {
  display: block;
}

.leaderboard {
  margin-top: 20px;
}

.leaderboard-entry {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 15px;
  background: #f9f9f9;
  border-radius: 8px;
  margin: 8px 0;
  border-left: 4px solid #667eea;
}

.leaderboard-rank {
  font-size: 1.5em;
  font-weight: bold;
  color: #667eea;
  min-width: 40px;
}

.leaderboard-info {
  flex: 1;
  margin-left: 15px;
}

.leaderboard-name {
  font-weight: 600;
  color: #333;
}

.leaderboard-course {
  font-size: 0.9em;
  color: #777;
}

.leaderboard-score {
  font-size: 1.3em;
  font-weight: bold;
  color: #667eea;
}

.answer-history {
  margin-top: 20px;
}

.history-item {
  padding: 12px;
  margin: 8px 0;
  border-radius: 8px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: #f9f9f9;
}

.history-item.correct {
  border-left: 4px solid #2ecc71;
}

.history-item.incorrect {
  border-left: 4px solid #e74c3c;
}

.history-question {
  flex: 1;
  font-weight: 500;
}

.history-status {
  padding: 5px 12px;
  border-radius: 5px;
  font-size: 0.9em;
  font-weight: 600;
}

.history-status.correct {
  background: #d5f4e6;
  color: #2ecc71;
}

.history-status.incorrect {
  background: #fadbd8;
  color: #e74c3c;
}

.flex-center {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
}

.form-group {
  margin: 15px 0;
}

.form-group label {
  display: block;
  font-weight: 600;
  margin-bottom: 8px;
  color: #667eea;
}

.lock-message {
  background: #fff3cd;
  border: 2px solid #ffc107;
  padding: 15px;
  border-radius: 10px;
  margin: 10px 0;
  color: #856404;
  font-weight: 600;
}

.exercise-tracker {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
  gap: 10px;
  margin: 20px 0;
}

.exercise-item {
  padding: 15px;
  border-radius: 10px;
  text-align: center;
  font-weight: 600;
  background: #f0f4ff;
  border: 2px solid #ddd;
  cursor: pointer;
  transition: all 0.3s ease;
}

.exercise-item:hover:not(.locked) {
  border-color: #667eea;
  background: #e3e8ff;
}

.exercise-item.completed {
  background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
  color: white;
  border-color: #4facfe;
}

.exercise-item.locked {
  background: #eee;
  color: #999;
  cursor: not-allowed;
  opacity: 0.6;
}

.exercise-item .name {
  display: block;
  margin-bottom: 5px;
  font-size: 0.9em;
}

.exercise-item .score {
  display: block;
  font-size: 0.8em;
  opacity: 0.8;
}
</style>
</head>

<body>
<header>
<h1>🇩🇪 A1 Fragen Trainer Pro</h1>
<p>Interaktives Lernen · Echte Konversation · Wettbewerb · Statistik</p>
</header>

<main>
<section id="login" class="card">
<h2>🎓 Willkommen</h2>
<div class="form-group">
  <label>Dein Name *</label>
  <input id="name" placeholder="z.B. Ahmed oder Maria">
</div>
<div class="form-group">
  <label>Kurscode *</label>
  <input id="course" placeholder="z.B. A1-Montag">
</div>
<div class="form-group">
  <label>Dein Geschlecht (optional)</label>
  <select id="gender">
    <option value="">-- Wählen --</option>
    <option value="m">Männlich (er/sein)</option>
    <option value="f">Weiblich (sie/ihr)</option>
  </select>
</div>
<div class="form-group">
  <label>Dein Heimatland (optional)</label>
  <select id="country">
    <option value="">-- Wählen --</option>
    <option value="Syrien">Syrien</option>
    <option value="Ukraine">Ukraine</option>
    <option value="Afghanistan">Afghanistan</option>
    <option value="Irak">Irak</option>
    <option value="Türkei">Türkei</option>
    <option value="Polen">Polen</option>
    <option value="Rumänien">Rumänien</option>
    <option value="Bulgarien">Bulgarien</option>
    <option value="Somalia">Somalia</option>
    <option value="Eritrea">Eritrea</option>
    <option value="Ghana">Ghana</option>
    <option value="Nigeria">Nigeria</option>
    <option value="Russland">Russland</option>
    <option value="Algerien">Algerien</option>
    <option value="Marokko">Marokko</option>
    <option value="Tunesien">Tunesien</option>
    <option value="Iran">Iran</option>
    <option value="Pakistan">Pakistan</option>
    <option value="Indien">Indien</option>
    <option value="Frankreich">Frankreich</option>
    <option value="Spanien">Spanien</option>
    <option value="Italien">Italien</option>
    <option value="USA">USA</option>
    <option value="China">China</option>
    <option value="Japan">Japan</option>
  </select>
</div>
<div class="flex-center">
  <button onclick="start()">🚀 Starten</button>
  <button class="secondary" onclick="teacher()">👨‍🏫 Lehrer-Dashboard</button>
</div>
</section>

<section id="app" class="hidden">
<div class="card">
  <div style="display: flex; justify-content: space-between; align-items: center;">
    <div>
      <div class="big" id="hello"></div>
      <div id="stats"></div>
    </div>
    <button class="secondary" onclick="logout()">Abmelden</button>
  </div>
</div>

<div class="stats" id="statsBox"></div>

<div id="exerciseTracker" class="exercise-tracker"></div>

<div class="grid card flex-center" id="gameButtons"></div>

<div class="flex-center">
  <button onclick="showStats()">📊 Meine Statistik</button>
  <button onclick="showLeaderboard()">🏅 Bestenliste</button>
  <button onclick="exportMe()">📤 Export</button>
</div>

<div id="game" class="card"></div>
</section>

<section id="statsSection" class="hidden">
<div class="card">
  <h2>📊 Deine Statistik</h2>
  <button class="secondary" onclick="closeStats()">Zurück</button>
  
  <div class="stats" id="personalStats"></div>
  
  <h3 style="color: #667eea; margin-top: 30px;">Antwort-Verlauf</h3>
  <div id="answerHistory"></div>
</div>
</section>

<section id="leaderboardSection" class="hidden">
<div class="card">
  <h2>🏅 Bestenliste</h2>
  <button class="secondary" onclick="closeLeaderboard()">Zurück</button>
  
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('global')">Global</button>
    <button class="tab-btn" onclick="switchTab('course')">Mein Kurs</button>
    <button class="tab-btn" onclick="switchTab('progress')">Schüler Fortschritt</button>
  </div>
  
  <div id="global" class="tab-content active leaderboard"></div>
  <div id="course" class="tab-content leaderboard"></div>
  <div id="progress" class="tab-content"></div>
</div>
</section>

<section id="dashboard" class="hidden">
<div class="card">
  <h2>📊 Lehrer-Dashboard</h2>
  <p>Schüler exportieren ihren Fortschritt. Importieren Sie hier die JSON-Dateien.</p>
  <input type="file" id="importFile" multiple accept=".json" onchange="importFiles(event)">
  <button onclick="downloadCSV()">📥 CSV / Excel exportieren</button>
  <button class="secondary" onclick="back()">Zurück</button>
  <div id="dashTable"></div>
</div>
</section>
</main>

<script>
const DEFAULT_PROFILE = {

  {topic:"Name",qSie:"Wie heißen Sie?",qDu:"Wie heißt du?",answerTemplates:["Ich heiße {name}.","Ich bin {name}.","Mein Name ist {name}."]},
  {topic:"Vorname",qSie:"Wie ist Ihr Vorname?",qDu:"Wie ist dein Vorname?",answerTemplates:["Mein Vorname ist {fname}.","Ich heiße {fname}.","{fname}."]},

  {topic:"Wohnort",qSie:"Wo wohnen Sie?",qDu:"Wo wohnst du?",answerTemplates:["Ich wohne in {city}.","In {city}."]},

  {topic:"Geburtsort",qSie:"Wo sind Sie geboren?",qDu:"Wo bist du geboren?",answerTemplates:["Ich bin in {birthplace} geboren.","In {birthplace}."]}
];

const EXERCISES = ['learn', 'qa', 'quickfire', 'listen', 'listenrespond', 'dictation', 'puzzle', 'speak', 'memory', 'exam'];
const EXERCISE_NAMES = {
  learn: '📚 Lernen',
  qa: '🗣️ Q&A',
  quickfire: '⚡ Blitzfeuer',
  listen: '🎧 Hören',
  listenrespond: '🎤 Hören & Antworten',
  dictation: '✍️ Diktat',
  puzzle: '🧩 Puzzle',
  speak: '🎤 Sprechen',
  memory: '🃏 Memory',
  exam: '🏆 Prüfung'
};

let student="", course="", gender="", country="", game="learn", i=0, score=0, attempts=0, correct=0;
let dashboard=[], answerHistory=[], memoryCards=[], first=null, lock=false;
let exerciseProgress = {};
let studentPerson = {};
let currentQuestion = null;
let currentAnswer = null;

function $(id){return document.getElementById(id)}
function item(){return DATA[i%DATA.length]}
function key(){return "A1_"+course+"_"+student}
function saveLocal(){localStorage.setItem(key(),JSON.stringify({student,course,gender,country,score,attempts,correct,i,date:new Date().toLocaleString(),answerHistory,exerciseProgress}));stats()}
function loadLocal(){let x=localStorage.getItem(key());if(x){x=JSON.parse(x);score=x.score||0;attempts=x.attempts||0;correct=x.correct||0;i=x.i||0;answerHistory=x.answerHistory||[];exerciseProgress=x.exerciseProgress||{}}}
function stats(){$("stats").innerHTML=`⭐ Punkte: <strong>${score}</strong> · ✅ Richtig: <strong>${correct}/${attempts}</strong> (${attempts>0?(correct*100/attempts).toFixed(0):0}%)`}

function countryMeta(origin){
  return COUNTRY_INFO[origin] || COUNTRY_INFO[DEFAULT_PROFILE.origin];
}

function fillTemplate(t, p=studentPerson){
  let first = p.fname || DEFAULT_PROFILE.fname;
  let last = p.lname || DEFAULT_PROFILE.lname;
  let full = (p.full || `${first} ${last}`).trim();
  let spell = first.toUpperCase().split("").join("-");
  return t.replaceAll("{name}", full)
          .replaceAll("{fname}", first)
          .replaceAll("{lname}", last)
          .replaceAll("{origin}", p.origin || DEFAULT_PROFILE.origin)
          .replaceAll("{lang}", p.lang || DEFAULT_PROFILE.lang)
          .replaceAll("{city}", p.city || DEFAULT_PROFILE.city)
          .replaceAll("{birthplace}", p.birthplace || DEFAULT_PROFILE.birthplace)
          .replaceAll("{age}", p.age || DEFAULT_PROFILE.age)
          .replaceAll("{spell_fname}", spell);
}

function generatePersonForAnswers(){
  let origins = Object.keys(COUNTRY_INFO);
  let origin = origins[Math.floor(Math.random() * origins.length)];
  let meta = countryMeta(origin);
  let genderKey = Math.random() > 0.5 ? 'm' : 'f';
  let fname = NAMES[genderKey][Math.floor(Math.random() * NAMES[genderKey].length)];
  let lname = meta.surnames[Math.floor(Math.random() * meta.surnames.length)];
  return {fname, lname, full: `${fname} ${lname}`, origin, lang: meta.lang, city: meta.city, birthplace: meta.birthplace, age: String(18 + Math.floor(Math.random()*45))};
}

function buildStudentPerson(){
  let raw = student.trim() || DEFAULT_PROFILE.full;
  let parts = raw.split(/\s+/).filter(Boolean);
  let origin = country || DEFAULT_PROFILE.origin;
  let meta = countryMeta(origin);
  let fname = parts[0] || DEFAULT_PROFILE.fname;
  let lname = parts.slice(1).join(" ") || DEFAULT_PROFILE.lname;
  return {
    fname,
    lname,
    full: `${fname} ${lname}`.trim(),
    origin,
    lang: meta.lang,
    city: meta.city,
    birthplace: meta.birthplace,
    age: DEFAULT_PROFILE.age,
    children: DEFAULT_PROFILE.children,
    marital: DEFAULT_PROFILE.marital
  };
}

function start(){
  student=$("name").value.trim() || DEFAULT_PROFILE.full; 
  course=$("course").value.trim() || "A1"; 
  gender=$("gender").value; 
  country=$("country").value || DEFAULT_PROFILE.origin;
  loadLocal(); 
  studentPerson = buildStudentPerson();
  $("login").classList.add("hidden"); $("app").classList.remove("hidden");
  $("hello").innerText="Hallo, "+studentPerson.fname+"!";
  stats(); updateStatsBox(); updateExerciseTracker(); renderGameButtons(); render();
}

function logout(){
  if(confirm("Wirklich abmelden?")){location.reload()}
}

function teacher(){$("login").classList.add("hidden");$("app").classList.add("hidden");$("dashboard").classList.remove("hidden")}
function back(){location.reload()}

function updateExerciseTracker(){
  let html = '';
  EXERCISES.forEach(ex => {
    let progress = exerciseProgress[ex] || 0;
    let isCompleted = progress >= 90;
    let isLocked = false;
    let exerciseIdx = EXERCISES.indexOf(ex);
    
    if(exerciseIdx > 0){
      let prevEx = EXERCISES[exerciseIdx - 1];
      let prevProgress = exerciseProgress[prevEx] || 0;
      isLocked = prevProgress < 90;
    }
    
    html += `<div class="exercise-item ${isCompleted ? 'completed' : ''} ${isLocked ? 'locked' : ''}" onclick="${isLocked ? '' : `mode('${ex}')`}">
      <span class="name">${EXERCISE_NAMES[ex]}</span>
      <span class="score">${progress}%</span>
    </div>`;
  });
  $("exerciseTracker").innerHTML = html;
}

function renderGameButtons(){
  let html = '';
  EXERCISES.forEach(ex => {
    let isLocked = false;
    let exerciseIdx = EXERCISES.indexOf(ex);
    
    if(exerciseIdx > 0){
      let prevEx = EXERCISES[exerciseIdx - 1];
      let prevProgress = exerciseProgress[prevEx] || 0;
      isLocked = prevProgress < 90;
    }
    
    html += `<button class="gamebtn ${isLocked ? 'locked' : ''}" onclick="${isLocked ? "alert('Löse zuerst die vorherige Aufgabe zu 90% ab!')" : `mode('${ex}')`}" ${isLocked ? 'disabled' : ''}>
      ${EXERCISE_NAMES[ex]}
    </button>`;
  });
  $("gameButtons").innerHTML = html;
}

function mode(m){
  let exerciseIdx = EXERCISES.indexOf(m);
  if(exerciseIdx > 0){
    let prevEx = EXERCISES[exerciseIdx - 1];
    let prevProgress = exerciseProgress[prevEx] || 0;
    if(prevProgress < 90){
      alert("Löse zuerst "+EXERCISE_NAMES[prevEx]+" zu 90% ab!");
      return;
    }
  }
  
  game=m;
  i=0;
  if(m==="memory")setupMemory();
  render();
}

function updateStatsBox(){
  let accuracy = attempts > 0 ? (correct * 100 / attempts).toFixed(0) : 0;
  $("statsBox").innerHTML=`
    <div class="stat-box">
      <div class="label">Punkte</div>
      <div class="number">${score}</div>
    </div>
    <div class="stat-box">
      <div class="label">Richtig</div>
      <div class="number">${correct}/${attempts}</div>
    </div>
    <div class="stat-box">
      <div class="label">Genauigkeit</div>
      <div class="number">${accuracy}%</div>
    </div>
    <div class="stat-box">
      <div class="label">Modus</div>
      <div class="number">${EXERCISE_NAMES[game].split(' ')[0]}</div>
    </div>
  `;
}

function speakText(t){
  let u=new SpeechSynthesisUtterance(t);u.lang="de-DE";u.rate=.85;speechSynthesis.cancel();speechSynthesis.speak(u)
}

function normalizeGermanNumber(t){
  return t.replace(/\beins\b/g,"1").replace(/\bein\b/g,"1").replace(/\bzwei\b/g,"2").replace(/\bdrei\b/g,"3").replace(/\bvier\b/g,"4").replace(/\bfünf\b/g,"5").replace(/\bfuenf\b/g,"5");
}
function clean(t){
  return normalizeGermanNumber((t||"").toLowerCase())
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/ß/g,"ss")
    .replace(/[.,!?;:]/g,"")
    .replace(/\s+/g," ")
    .trim();
}
function answerVariants(x=item(), p=studentPerson){
  let templates = x.answerTemplates || x.alts || (x.a ? [x.a] : []);
  let variants = templates.map(t => fillTemplate(t, p));
  if(x.topic==="Buchstabieren"){
    let f = (p.fname || DEFAULT_PROFILE.fname).toUpperCase();
    variants.push(f.split("").join(" "), f);
  }
  return [...new Set(variants.filter(Boolean))];
}
function ok(user,answer){
  let u=clean(user);
  let variants = answer ? [answer] : answerVariants();
  return variants.some(v => {
    let a=clean(v);
    if(!u || !a) return false;
    return u===a || (u.length>3 && a.includes(u)) || (a.length>3 && u.includes(a));
  });
}
function showAdvanceButton(good){
  let fb = $("feedback");
  if(!fb || !good) return;
  let finished = i >= DATA.length - 1;
  if(finished){
    exerciseProgress[game] = 100;
    fb.innerHTML += `<button class="success" id="continueExerciseBtn">✅ Du darfst zur nächsten Übung weiter</button>`;
    setTimeout(()=>{
      let b=$("continueExerciseBtn");
      if(b) b.onclick = () => goNextExercise();
    },0);
  } else {
    fb.innerHTML += `<button class="success" id="nextQuestionBtn">⏭️ Nächste Frage</button>`;
    setTimeout(()=>{
      let b=$("nextQuestionBtn");
      if(b) b.onclick = () => { i++; saveLocal(); render(); };
    },0);
  }
}
function goNextExercise(){
  let idx = EXERCISES.indexOf(game);
  saveLocal(); updateExerciseTracker(); renderGameButtons();
  if(idx >= 0 && idx < EXERCISES.length-1){ mode(EXERCISES[idx+1]); }
  else { $("game").innerHTML = `<h2>🏆 Fertig!</h2><div class="ok">Sehr gut! Alle Übungen sind abgeschlossen.</div>`; }
}
function mark(good, userAnswer=""){
  attempts++;
  let entry = {question: item().topic, correct: good, answer: userAnswer, acceptedAnswers: answerVariants(), timestamp: new Date().toLocaleTimeString()};
  answerHistory.push(entry);
  if(good){ correct++; score+=10; }
  let perQuestionProgress = Math.round(((i + (good ? 1 : 0)) / DATA.length) * 100);
  exerciseProgress[game] = Math.max(exerciseProgress[game] || 0, Math.min(100, perQuestionProgress));
  if(good){
    $("feedback").innerHTML="<div class='ok'>✔ Richtig! +10 Punkte</div>";
  } else {
    $("feedback").innerHTML="<div class='no'>❌ Nicht ganz. Mögliche Antwort: <strong>"+getAnswer()+"</strong><br><span class='small'>Auch akzeptiert: "+answerVariants().join(" · ")+"</span></div>";
  }
  saveLocal(); updateStatsBox(); updateExerciseTracker(); renderGameButtons();
  showAdvanceButton(good);
}
function getAnswer(){
  return answerVariants()[0] || "...";
}
function getRandomizedAnswers(){
  let x = item();
  let correctAnswer = getAnswer();
  let otherAnswers = [];
  let guard = 0;
  while(otherAnswers.length < 3 && guard < 30){
    guard++;
    let otherPerson = generatePersonForAnswers();
    let otherAnswer = answerVariants(x, otherPerson)[0];
    if(otherAnswer && clean(otherAnswer)!==clean(correctAnswer) && !otherAnswers.some(o=>clean(o)===clean(otherAnswer))){ otherAnswers.push(otherAnswer); }
  }
  return shuffle([correctAnswer, ...otherAnswers]);
}

      });

      <div id="feedback"></div>`;
    }
    
    if(game==="puzzle"){
      let words=shuffle(x.qSie.replace("?"," ?").split(" "));
      html+=`<p>🧩 Baue die Frage richtig zusammen.</p>
      <div style="background:#f0f4ff; padding:15px; border-radius:10px; margin:10px 0;">
        <div id="chosen" style="min-height:40px; display:flex; flex-wrap:wrap; gap:8px; align-items:center;"></div>
      </div>
      <div style="margin:15px 0;" id="wordList"></div>
      <button id="checkPuzzleBtn">Überprüfen</button>
      <button class="secondary" id="resetPuzzleBtn">Neu</button>
      <div id="feedback"></div>`;

function attachEventListeners(){
  // Learn events
  if(game === "learn"){
    let speakQ = $("speakQuestion");
    let speakA = $("speakAnswer");
    let next = $("nextBtn");
    if(speakQ) speakQ.onclick = () => speakText(currentQuestion);
    if(speakA) speakA.onclick = () => speakText(currentAnswer);
    if(next) next.onclick = () => {
      if(i >= DATA.length - 1){
        exerciseProgress.learn = 100;
        saveLocal(); updateExerciseTracker(); renderGameButtons();
        $("game").innerHTML = `<h2>📚 Lernen</h2><div class="ok">✅ Lernen abgeschlossen!</div><button class="success" onclick="goNextExercise()">✅ Du darfst zur nächsten Übung weiter</button>`;
      } else {
        i++;
        exerciseProgress.learn = Math.min(100, Math.round((i / DATA.length) * 100));
        saveLocal(); updateExerciseTracker(); renderGameButtons(); render();
      }
    };
  }
  
  // QA events
  if(game === "qa"){
    let check = $("checkBtn");
    let show = $("showBtn");
    if(check) check.onclick = () => { let u=$("ans").value; if(ok(u,getAnswer())){mark(true,u)}else{mark(false,u)} };
    if(show) show.onclick = () => $("ans").value = getAnswer();
  }
  
  // Quickfire events
  if(game === "quickfire"){
    document.querySelectorAll(".quiz-option").forEach(btn => {
      btn.onclick = () => { let ans = btn.dataset.answer; if(ans===getAnswer()||ok(ans,getAnswer())){mark(true,ans)}else{mark(false,ans)} };
    });
  }
  
  // Listen events
  if(game === "listen"){
    let play = $("playQuestion");
    if(play) play.onclick = () => speakText(currentQuestion);
    document.querySelectorAll(".listen-option").forEach(btn => {
      btn.onclick = () => { let ans = btn.dataset.answer; if(ans===getAnswer()||ok(ans,getAnswer())){mark(true,ans)}else{mark(false,ans)} };
    });
  }
  
  // Listen Respond events
  if(game === "listenrespond"){
    let play = $("playQuestionRespond");
    let record = $("recordRespond");
    let cont = $("listenContinue");
    if(play) play.onclick = () => speakText(currentQuestion);
    if(record) record.onclick = listenAndRespond;
    if(cont) cont.onclick = () => { if(i >= DATA.length - 1){ goNextExercise(); } else { i++; render(); } };
    setTimeout(() => {
      $("questionText").innerText = currentQuestion;
    }, 100);
  }
  
  // Dictation events
  if(game === "dictation"){
    let dictate = $("dictateBtn");
    let check = $("checkDictBtn");
    if(dictate) dictate.onclick = () => speakText(currentAnswer);
    if(check) check.onclick = () => { let u=$("ans").value; if(ok(u,getAnswer())){mark(true,u)}else{mark(false,u)} };
  }
  
  // Puzzle events
  if(game === "puzzle"){
    let x = item();
    let words = shuffle(x.qSie.replace("?"," ?").split(" "));
    let wordList = $("wordList");
    wordList.innerHTML = words.map(w=>`<button class="word puzzle-word">${w}</button>`).join("");
    document.querySelectorAll(".puzzle-word").forEach(btn => {
      btn.onclick = () => {
        let chosen = $("chosen");
        chosen.appendChild(btn.cloneNode(true));
        btn.style.opacity="0.5";
      };
    });
    let checkPuzzle = $("checkPuzzleBtn");
    let resetPuzzle = $("resetPuzzleBtn");
    if(checkPuzzle) checkPuzzle.onclick = () => {
      let chosen=$("chosen").innerText.trim().split(" ").filter(w=>w);
      let correct=x.qSie.replace("?"," ?").split(" ");
      if(JSON.stringify(chosen)===JSON.stringify(correct)){mark(true)}else{mark(false)}
    };
    if(resetPuzzle) resetPuzzle.onclick = () => render();
  }
  
  // Speak events
  if(game === "speak"){
    let record = $("recordSpeakBtn");
    let cont = $("speakContinue");
    if(record) record.onclick = listenSpeech;
    if(cont) cont.onclick = () => { if(i >= DATA.length - 1){ goNextExercise(); } else { i++; render(); } };
  }
  
  // Exam events
  if(game === "exam"){
    let check = $("checkExamBtn");
    let speak = $("speakExamBtn");
    let next = $("nextExamBtn");
    if(check) check.onclick = () => { let u=$("ans").value; if(ok(u,getAnswer())){mark(true,u)}else{mark(false,u)} };
    if(speak) speak.onclick = () => speakText(currentQuestion);
    if(next) next.onclick = () => { i++; render(); };
  }
  
  // Memory events
  if(game === "memory"){
    let grid = $("memoryGrid");
    grid.innerHTML = memoryCards.map((c,idx)=>`<div class="memcard" data-idx="${idx}">${c.open||c.done?c.text:"?"}</div>`).join("");
    document.querySelectorAll(".memcard").forEach(card => {
      card.onclick = () => flip(parseInt(card.dataset.idx));
    });
  }
}

function listenAndRespond(){
  if(!('webkitSpeechRecognition' in window)){alert("Speech Recognition nicht unterstützt. Versuchen Sie Chrome oder Edge.");return}
  let recognition=new webkitSpeechRecognition();
  recognition.lang='de-DE';
  recognition.start();
  recognition.onresult=e=>{
    let t=e.results[e.results.length-1][0].transcript;
    $("heard").innerText="Gehört: "+t;
    if(ok(t,getAnswer())){mark(true,t);$("listenContinue").classList.remove("hidden")}else{mark(false,t)}
  };
}

function listenSpeech(){
  if(!('webkitSpeechRecognition' in window)){alert("Speech Recognition nicht unterstützt.");return}
  let recognition=new webkitSpeechRecognition();
  recognition.lang='de-DE';
  recognition.start();
  recognition.onresult=e=>{
    let t=e.results[e.results.length-1][0].transcript;
    $("heard").innerText="Gesprochen: "+t;
    if(ok(t,getAnswer())){mark(true,t);$("speakContinue").classList.remove("hidden")}else{mark(false,t)}
  };
}

function setupMemory(){
  memoryCards=[];
  for(let j=0;j<5;j++){
    let x=DATA[j%DATA.length];
    let ans=getAnswer();
    memoryCards.push({text:x.qSie,open:false,done:false},{text:ans,open:false,done:false});
  }
  memoryCards=shuffle(memoryCards);
}

function flip(idx){
  if(lock||memoryCards[idx].done)return;
  memoryCards[idx].open=!memoryCards[idx].open;
  if(first===null){first=idx;render();return}
  lock=true;
  setTimeout(()=>{
    if(memoryCards[first].text===memoryCards[idx].text){
      memoryCards[first].done=memoryCards[idx].done=true;
      mark(true);
      first=null;
    }else{
      memoryCards[first].open=memoryCards[idx].open=false;
      mark(false);
      first=null;
    }
    lock=false;
    render();
  },1000);
}

function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function showStats(){
  let html=`<div class="stats">`;
  html+=`<div class="stat-box"><div class="label">Gesamt Punkte</div><div class="number">${score}</div></div>`;
  html+=`<div class="stat-box"><div class="label">Richtige Antworten</div><div class="number">${correct}</div></div>`;
  html+=`<div class="stat-box"><div class="label">Versuche</div><div class="number">${attempts}</div></div>`;
  html+=`<div class="stat-box"><div class="label">Genauigkeit</div><div class="number">${attempts>0?(correct*100/attempts).toFixed(0):0}%</div></div>`;
  html+=`</div>`;
  $("personalStats").innerHTML=html;
  let historyHtml=``;
  answerHistory.forEach(h=>{
    historyHtml+=`<div class="history-item ${h.correct?'correct':'incorrect'}">
      <span class="history-question">${h.question}</span>
      <span class="history-status ${h.correct?'correct':'incorrect'}">${h.correct?'✓ Richtig':'✗ Falsch'}</span>
    </div>`;
  });
  $("answerHistory").innerHTML=historyHtml||"<p>Noch keine Antworten</p>";
  $("statsSection").classList.remove("hidden");
  $("app").classList.add("hidden");
}

function closeStats(){
  $("statsSection").classList.add("hidden");
  $("app").classList.remove("hidden");
}

function showLeaderboard(){
  let globalBoard=JSON.parse(localStorage.getItem("A1_LEADERBOARD")||"[]");
  let courseBoard=globalBoard.filter(e=>e.course===course);
  
  $("global").innerHTML=globalBoard.slice(0,10).map((e,i)=>`<div class="leaderboard-entry">
    <span class="leaderboard-rank">${i+1}</span>
    <div class="leaderboard-info">
      <div class="leaderboard-name">${e.name}</div>
      <div class="leaderboard-course">${e.course}</div>
    </div>
    <div class="leaderboard-score">${e.score} Pts</div>
  </div>`).join("");
  
  $("course").innerHTML=courseBoard.slice(0,10).map((e,i)=>`<div class="leaderboard-entry">
    <span class="leaderboard-rank">${i+1}</span>
    <div class="leaderboard-info">
      <div class="leaderboard-name">${e.name}</div>
    </div>
    <div class="leaderboard-score">${e.score} Pts</div>
  </div>`).join("");
  
  let progressHtml=`<table><tr><th>Name</th><th>Learn</th><th>QA</th><th>Quickfire</th></tr>`;
  courseBoard.forEach(e=>{
    progressHtml+=`<tr><td>${e.name}</td><td>${e.learn||0}%</td><td>${e.qa||0}%</td><td>${e.quickfire||0}%</td></tr>`;
  });
  progressHtml+=`</table>`;
  $("progress").innerHTML=progressHtml;
  
  $("leaderboardSection").classList.remove("hidden");
  $("app").classList.add("hidden");
}

function closeLeaderboard(){
  $("leaderboardSection").classList.add("hidden");
  $("app").classList.remove("hidden");
}

function switchTab(tab){
  document.querySelectorAll(".tab-btn").forEach(b=>b.classList.remove("active"));
  document.querySelectorAll(".tab-content").forEach(c=>c.classList.remove("active"));
  event.target.classList.add("active");
  $(tab).classList.add("active");
}

function exportMe(){
  let entry={name:student,course:course,score:score,attempts:attempts,correct:correct,date:new Date().toLocaleString()};
  Object.assign(entry,exerciseProgress);
  let leaderboard=JSON.parse(localStorage.getItem("A1_LEADERBOARD")||"[]");
  leaderboard.push(entry);
  localStorage.setItem("A1_LEADERBOARD",JSON.stringify(leaderboard));
  
  let data=JSON.stringify({student,course,score,attempts,correct,answerHistory,exerciseProgress},null,2);
  let blob=new Blob([data],{type:"application/json"});
  let url=URL.createObjectURL(blob);
  let a=document.createElement("a");
  a.href=url;
  a.download=student+"_"+course+".json";
  a.click();
}

function importFiles(e){
  let files=e.target.files;
  let allData=[];
  let processed=0;
  
  for(let f of files){
    let reader=new FileReader();
    reader.onload=ev=>{
      let data=JSON.parse(ev.target.result);
      allData.push(data);
      processed++;
      if(processed===files.length){
        let csv="Name,Kurs,Punkte,Richtig,Versuche,Genauigkeit\n";
        allData.forEach(d=>{
          csv+=`${d.student},${d.course},${d.score},${d.correct},${d.attempts},${d.attempts>0?(d.correct*100/d.attempts).toFixed(0):0}\n`;
        });
        $("dashTable").innerHTML=`<textarea style="width:100%;height:300px;">${csv}</textarea>`;
      }
    };
    reader.readAsText(f);
  }
}

function downloadCSV(){
  let csv="Name,Kurs,Punkte,Richtig,Versuche,Genauigkeit\n";
  let leaderboard=JSON.parse(localStorage.getItem("A1_LEADERBOARD")||"[]");
  leaderboard.forEach(e=>{
    csv+=`${e.name},${e.course},${e.score},${e.correct},${e.attempts},${e.attempts>0?(e.correct*100/e.attempts).toFixed(0):0}\n`;
  });
  let blob=new Blob([csv],{type:"text/csv"});
  let url=URL.createObjectURL(blob);
  let a=document.createElement("a");
  a.href=url;
  a.download="A1_Ergebnisse.csv";
  a.click();
}
</script>
